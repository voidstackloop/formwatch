# cargo-deny policy. Run locally with `cargo deny check`, or via the
# "deny" job in .github/workflows/ci.yml.
#
# The allow-list is deliberately explicit: a new dependency whose license
# isn't listed should be a deliberate, reviewed change, not a silent one.

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# Allow anything already allowed; don't fail on entries we don't use.
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
