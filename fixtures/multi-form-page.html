<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Two Forms One Page</title></head>
<body>
  <h1>Search this site</h1>
  <form id="search-form">
    <label for="q">Search</label>
    <input type="text" id="q" name="q">
    <button type="submit">Search</button>
  </form>

  <h1>Apply for a permit</h1>
  <form id="apply-form">
    <label for="applicant">Applicant name</label>
    <input type="text" id="applicant" name="applicant" required>
    <label for="applicant-email">Email</label>
    <input type="email" id="applicant-email" name="applicant-email" required>
    <button type="submit">Apply</button>
  </form>
</body>
</html>
