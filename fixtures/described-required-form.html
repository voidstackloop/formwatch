<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Described required field</title>
</head>
<body>
<main>
  <h1>Described required field</h1>
  <form id="described">
    <label for="fullname">Full name</label>
    <input id="fullname" name="fullname" type="text" required aria-describedby="fullname-help">
    <small id="fullname-help">As it appears on your ID.</small>
    <button type="submit">Submit</button>
  </form>
</main>
</body>
</html>
