<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Viewport Zoom Disabled</title>
</head>
<body>
  <!-- user-scalable=no blocks pinch-zoom outright — a low-vision user on
       a phone can't zoom in to read this page no matter what they do. -->
  <form>
    <label for="name">Full name</label>
    <input id="name" name="name" type="text">
    <button type="submit">Submit</button>
  </form>
</body>
</html>
