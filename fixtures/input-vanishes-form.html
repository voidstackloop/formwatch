<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Input Vanishes Silently</title></head>
<body>
  <!-- Simulates a real "lost input" bug: something on the page clears the
       field shortly after the user types, with no explanation (no session
       warning, nothing) — check_input_persistence should Fail on this. -->
  <form>
    <label for="fullname">Full name</label>
    <input id="fullname" name="fullname" type="text">

    <button type="submit">Submit</button>
  </form>
  <script>
    // Not a bare setTimeout from page load: that raced against how long
    // formwatch itself takes to get around to setting its own marker
    // value (fine on a fast dev machine, but flaky on a loaded CI
    // runner — the clear could fire before formwatch ever wrote the
    // marker, silently defeating the whole scenario). Waiting for the
    // field's own `input` event ties the clear to formwatch's actual
    // action instead of an arbitrary wall-clock guess.
    document.getElementById('fullname').addEventListener(
      'input',
      () => setTimeout(() => { document.getElementById('fullname').value = ''; }, 100),
      { once: true },
    );
  </script>
</body>
</html>
