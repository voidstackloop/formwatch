<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LLM semantic check fixture</title>
</head>
<body>
<main>
  <h1>Utility assistance application</h1>
  <form id="apply">
    <p>To apply for assistance you must upload a PDF copy of your most recent
       utility bill. The document must be under 5&nbsp;MB and dated within the
       last 60 days.</p>

    <label for="fullname">Full name</label>
    <input id="fullname" name="fullname" type="text" required>

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required>

    <div class="error" role="alert">Invalid input.</div>

    <button type="submit">Submit application</button>
  </form>
</main>
</body>
</html>
