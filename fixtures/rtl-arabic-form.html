<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>نموذج طلب</title></head>
<body>
  <h1>طلب تصريح</h1>
  <form>
    <div class="step" data-step="1">
      <label for="s1name">الاسم الكامل</label>
      <input type="text" id="s1name" name="s1name" required>
      <button type="button" id="nextBtn">التالي</button>
    </div>
    <div class="step" data-step="2" hidden>
      <label for="s2email">البريد الإلكتروني</label>
      <input type="email" id="s2email" name="s2email" required>
      <button type="submit" id="submitBtn">إرسال</button>
    </div>
  </form>
  <script>
    document.getElementById('nextBtn').addEventListener('click', () => {
      document.querySelector('[data-step="1"]').hidden = true;
      document.querySelector('[data-step="2"]').hidden = false;
    });
  </script>
</body>
</html>
