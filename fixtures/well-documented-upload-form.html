<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Well Documented Upload</title></head>
<body>
  <form>
    <label for="id-scan">Upload a scan of your ID (PDF or JPG, max 5MB)</label>
    <input type="file" id="id-scan" name="idfile" accept=".pdf,.jpg,.jpeg">

    <button type="submit">Submit</button>
  </form>
</body>
</html>
