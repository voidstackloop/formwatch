<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Mentions Documents, No Upload Field</title></head>
<body>
  <!-- The page tells you to upload a document but never actually gives you
       a way to attach one — the exact "unclear/missing required documents"
       failure formwatch exists to catch. -->
  <form>
    <p>You must upload a copy of your ID before submitting this application.</p>
    <label for="fullname">Full name</label>
    <input id="fullname" name="fullname" type="text">

    <button type="submit">Submit</button>
  </form>
</body>
</html>
