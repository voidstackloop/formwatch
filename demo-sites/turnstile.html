<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudflare Turnstile</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<main>
  <h1>Cloudflare Turnstile widget</h1>
  <p class="lede">A Turnstile widget on a real form — Bot protection
  should Warn and note the form itself was still found.</p>

  <form id="f">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-help">
    <small class="hint" id="name-help">As it appears on your ID.</small>
    <div class="cf-turnstile" data-sitekey="demo"></div>
    <p><button type="submit">Submit</button></p>
  </form>
</main>
</body>
</html>
