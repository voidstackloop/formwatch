<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyup-gated next</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<main>
  <h1>Keyup-gated next</h1>
  <p class="lede">The Continue button stays disabled until you <em>type</em>
  (a <code>keyup</code> listener). formwatch dispatches key events while
  filling, so Submission flow should Pass rather than report a stuck form.</p>

  <form id="wizard">
    <fieldset id="s1">
      <legend>Step 1 of 2</legend>
      <label for="s1name">Full name</label>
      <input id="s1name" name="s1name" type="text" autocomplete="name">
      <p><button type="button" id="next" disabled>Continue</button></p>
    </fieldset>
    <fieldset id="s2" hidden>
      <legend>Step 2 of 2</legend>
      <label for="s2ref">Reference number</label>
      <input id="s2ref" name="s2ref" type="text">
      <p><button type="submit">Submit</button></p>
    </fieldset>
  </form>

  <script>
    // NB: not `var name` — that collides with window.name.
    var nameField = document.getElementById('s1name');
    nameField.addEventListener('keyup', function () {
      document.getElementById('next').disabled = false;
    });
    document.getElementById('next').addEventListener('click', function () {
      document.getElementById('s1').hidden = true;
      document.getElementById('s2').hidden = false;
    });
  </script>
</main>
</body>
</html>
