<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal overflow</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<main>
  <h1>Wide content</h1>
  <p class="lede">The 1200px block below is wider than a phone screen, so
  Mobile usability should Warn (horizontal overflow at 375px).</p>
  <div style="width:1200px;height:24px;background:#e8e8e8"></div>

  <form id="f">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-help">
    <small class="hint" id="name-help">As it appears on your ID.</small>
    <p><button type="submit">Submit</button></p>
  </form>
</main>
</body>
</html>
