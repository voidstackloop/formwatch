<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image with no alt text</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<main>
  <h1>Image with no alt text</h1>
  <p class="lede">The logo has no <code>alt</code> attribute, so a screen
  reader gets nothing — Accessibility should Fail (axe image-alt, critical).</p>
  <p><img src="data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA=" width="80" height="40"></p>

  <form id="f">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-help">
    <small class="hint" id="name-help">As it appears on your ID.</small>
    <p><button type="submit">Submit</button></p>
  </form>
</main>
</body>
</html>
