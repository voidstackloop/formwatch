<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon-only buttons</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<main>
  <h1>Icon-only buttons</h1>
  <p class="lede">The Next and Submit controls have no visible text, only
  an icon and an <code>aria-label</code> — formwatch reads the label, so
  Submission flow should Pass.</p>

  <form id="wizard">
    <fieldset id="s1">
      <legend>Step 1 of 2</legend>
      <label for="s1name">Full name</label>
      <input id="s1name" name="s1name" type="text" autocomplete="name">
      <p><button type="button" aria-label="Next" onclick="go()"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l8 6-8 6z" fill="currentColor"/></svg></button></p>
    </fieldset>
    <fieldset id="s2" hidden>
      <legend>Step 2 of 2</legend>
      <label for="s2ref">Reference number</label>
      <input id="s2ref" name="s2ref" type="text">
      <p><button type="submit" aria-label="Submit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8l4 4 8-9" stroke="currentColor" stroke-width="2" fill="none"/></svg></button></p>
    </fieldset>
  </form>

  <script>
    function go() {
      document.getElementById('s1').hidden = true;
      document.getElementById('s2').hidden = false;
    }
  </script>
</main>
</body>
</html>
