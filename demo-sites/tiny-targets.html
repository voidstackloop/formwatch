<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny controls</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<main>
  <h1>Search the records office</h1>
  <p class="lede">The controls below are far under the 44x44px
  recommendation — Mobile usability should Warn on tiny tap targets.</p>

  <form id="tiny">
    <label for="search">Search term</label>
    <input id="search" name="search" type="text" autocomplete="off">
    <button class="tiny" type="submit">Go</button>
    <a href="#" class="tiny" aria-label="Clear">&times;</a>
  </form>
</main>
</body>
</html>
