<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No landmarks</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<!-- Deliberately no <main> and content outside any landmark: axe reports
     landmark-one-main and region (moderate), so Accessibility Warns. -->
<h1>No landmarks</h1>
<p class="lede">This page has no <code>&lt;main&gt;</code> landmark and no
region wrappers — Accessibility should Warn (moderate axe findings).</p>
<form id="f">
  <label for="name">Full name</label>
  <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-help">
  <small class="hint" id="name-help">As it appears on your ID.</small>
  <p><button type="submit">Submit</button></p>
</form>
</body>
</html>
